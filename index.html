<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060817">
  <meta name="description" content="Angelcho — Building things with Python, AI & Data.">
  <title>Angelcho</title>

  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="hero">
    <div class="ambient ambient-left" aria-hidden="true"></div>
    <div class="ambient ambient-right" aria-hidden="true"></div>

    <div class="particles" aria-hidden="true">
      <span style="--x:6%;--y:24%"></span>
      <span style="--x:13%;--y:67%"></span>
      <span style="--x:21%;--y:42%"></span>
      <span style="--x:30%;--y:78%"></span>
      <span style="--x:39%;--y:30%"></span>
      <span style="--x:49%;--y:83%"></span>
      <span style="--x:59%;--y:36%"></span>
      <span style="--x:69%;--y:72%"></span>
      <span style="--x:79%;--y:27%"></span>
      <span style="--x:88%;--y:59%"></span>
      <span style="--x:95%;--y:35%"></span>
    </div>

    <section class="content">
      <div class="terminal" aria-hidden="true">&gt;_</div>

      <h1>Angelcho</h1>

      <p class="tagline">Building things with Python, AI &amp; Data.</p>

      <div class="skills" aria-label="Skills">
        <div class="skill"><span>🐍</span>Python</div>
        <div class="skill"><span>🧠</span>AI</div>
        <div class="skill"><span>📊</span>Data</div>
        <div class="skill"><span>⚡</span>Energy</div>
        <div class="skill"><span>⚙️</span>Automation</div>
      </div>

      <div class="intro">
        <p>Personal space for projects, experiments and tools.</p>
        <p class="muted">More coming soon.</p>
      </div>

      <div class="actions">
        <!-- Replace with your real GitHub profile URL before final launch -->
        <a class="button button-primary"
           href="https://github.com/"
           target="_blank"
           rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.77-.25.77-.55v-2.16c-3.15.69-3.81-1.34-3.81-1.34-.52-1.31-1.26-1.66-1.26-1.66-1.03-.71.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.74 2.66 1.24 3.31.95.1-.74.4-1.24.72-1.52-2.51-.29-5.15-1.26-5.15-5.59 0-1.24.44-2.25 1.17-3.04-.12-.29-.51-1.44.11-3 0 0 .95-.3 3.11 1.16A10.8 10.8 0 0 1 12 6.08c.96 0 1.92.13 2.82.38 2.16-1.46 3.11-1.16 3.11-1.16.62 1.56.23 2.71.11 3 .73.79 1.17 1.8 1.17 3.04 0 4.34-2.65 5.3-5.17 5.58.41.35.77 1.04.77 2.1v3.15c0 .3.2.66.78.55A11.3 11.3 0 0 0 12 .7Z"/>
          </svg>
          <span>GitHub</span>
        </a>

        <button class="button button-secondary" id="projectsButton" type="button">
          Projects coming soon
        </button>
      </div>

      <div class="socials" aria-label="Social links">
        <a href="https://github.com/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.77-.25.77-.55v-2.16c-3.15.69-3.81-1.34-3.81-1.34-.52-1.31-1.26-1.66-1.26-1.66-1.03-.71.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.74 2.66 1.24 3.31.95.1-.74.4-1.24.72-1.52-2.51-.29-5.15-1.26-5.15-5.59 0-1.24.44-2.25 1.17-3.04-.12-.29-.51-1.44.11-3 0 0 .95-.3 3.11 1.16A10.8 10.8 0 0 1 12 6.08c.96 0 1.92.13 2.82.38 2.16-1.46 3.11-1.16 3.11-1.16.62 1.56.23 2.71.11 3 .73.79 1.17 1.8 1.17 3.04 0 4.34-2.65 5.3-5.17 5.58.41.35.77 1.04.77 2.1v3.15c0 .3.2.66.78.55A11.3 11.3 0 0 0 12 .7Z"/>
          </svg>
        </a>

        <!-- Replace # with your LinkedIn URL -->
        <a href="#" class="placeholder-link" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M5.3 7.7H1.8V19h3.5V7.7ZM3.55 2A2.05 2.05 0 1 0 3.55 6.1 2.05 2.05 0 0 0 3.55 2ZM22.2 12.5c0-3.4-1.8-5-4.25-5-1.95 0-2.83 1.08-3.3 1.82V7.7H11.2V19h3.45v-5.6c0-1.48.28-2.91 2.1-2.91 1.8 0 1.83 1.7 1.83 3.02V19h3.62v-6.5Z"/>
          </svg>
        </a>

        <!-- Replace # with mailto:your@email.com -->
        <a href="#" class="placeholder-link" aria-label="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 5.5h17v13h-17z" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="m4.4 6.5 7.6 6 7.6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </section>

    <div class="bottom-glow" aria-hidden="true"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    Projects coming soon ✨
  </div>

  <script src="./js/script.js"></script>
</body>
</html>
